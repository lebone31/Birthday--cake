<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday Experience</title>

<style>
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  background: radial-gradient(circle at top, #0b0f1f, #000);
  font-family: Arial;
  color: white;
}

/* ===== SCENE LAYER SYSTEM ===== */
.layer {
  position: absolute;
  width: 100%;
  height: 100%;
}

/* BACKGROUND FLOATERS */
.balloon {
  position: absolute;
  width: 22px;
  height: 30px;
  border-radius: 50%;
  bottom: -100px;
  animation: floatUp linear infinite;
  opacity: 0.6;
}

@keyframes floatUp {
  from { transform: translateY(0); }
  to { transform: translateY(-120vh); }
}

/* CENTER STAGE (THIS FIXES YOUR ISSUE) */
.center {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  z-index: 10;
}

/* TEXT FRONT */
h1 {
  margin: 0;
  font-size: 28px;
  z-index: 20;
}

#typed {
  margin-top: 10px;
  opacity: 0.7;
  font-size: 15px;
  height: 25px;
  z-index: 20;
}

/* ===== CAKE ===== */
.cake {
  margin-top: 40px;
  width: 320px;
  height: 200px;
  background: linear-gradient(145deg, #1a1a1a, #000);
  border-radius: 25px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.7);
  position: relative;
}

/* frosting */
.cake::before {
  content: "";
  position: absolute;
  top: -25px;
  left: 15px;
  right: 15px;
  height: 60px;
  background: #ffffff;
  border-radius: 50%;
  box-shadow: 0 0 25px rgba(255,255,255,0.15);
}

/* candles */
.candle {
  width: 10px;
  height: 70px;
  background: white;
  position: absolute;
  top: -75px;
}

.c1 { left: 80px; }
.c2 { left: 150px; }
.c3 { left: 220px; }

/* flame */
.flame {
  width: 12px;
  height: 12px;
  background: orange;
  border-radius: 50%;
  position: absolute;
  top: -15px;
  left: -1px;
  box-shadow: 0 0 20px orange;
}

/* particles (premium atmosphere) */
.particle {
  position: absolute;
  width: 3px;
  height: 3px;
  background: rgba(255,255,255,0.5);
  border-radius: 50%;
  animation: drift 12s linear infinite;
}

@keyframes drift {
  from { transform: translateY(0); }
  to { transform: translateY(-1000px); }
}
</style>
</head>

<body>

<!-- BACKGROUND -->
<div class="layer" id="bg"></div>

<!-- CENTER SCENE -->
<div class="center">

  <h1>🎉 Happy Birthday to Charlie’s Brother 🎉</h1>
  <div id="typed"></div>

  <div class="cake">
    <div class="candle c1"><div class="flame"></div></div>
    <div class="candle c2"><div class="flame"></div></div>
    <div class="candle c3"><div class="flame"></div></div>
  </div>

</div>

<script>

let flames = document.querySelectorAll(".flame");

/* ===== MIC BLOW ===== */
navigator.mediaDevices.getUserMedia({ audio: true })
.then(stream => {
  const audioCtx = new AudioContext();
  const mic = audioCtx.createMediaStreamSource(stream);
  const analyser = audioCtx.createAnalyser();

  mic.connect(analyser);
  const data = new Uint8Array(analyser.frequencyBinCount);

  function detect() {
    analyser.getByteFrequencyData(data);
    let volume = data.reduce((a,b)=>a+b) / data.length;

    if (volume > 25) {
      flames.forEach(f => f.style.opacity = "0");
    }

    requestAnimationFrame(detect);
  }

  detect();
});

/* ===== TEXT TYPE ===== */
let text = "Make a wish ✨";
let i = 0;

function type() {
  if (i < text.length) {
    document.getElementById("typed").innerHTML += text[i];
    i++;
    setTimeout(type, 55);
  }
}
type();

/* ===== BALLOONS (TikTok style background motion) ===== */
for (let i = 0; i < 20; i++) {
  let b = document.createElement("div");
  b.className = "balloon";
  b.style.left = Math.random() * 100 + "%";
  b.style.background = ["#fff","#ccc","#999"][i % 3];
  b.style.animationDuration = (6 + Math.random() * 8) + "s";
  document.body.appendChild(b);
}

/* ===== PARTICLES ===== */
for (let i = 0; i < 35; i++) {
  let p = document.createElement("div");
  p.className = "particle";
  p.style.left = Math.random() * 100 + "%";
  p.style.animationDuration = (6 + Math.random() * 6) + "s";
  document.body.appendChild(p);
}

</script>

</body>
</html>
