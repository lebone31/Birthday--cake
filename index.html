<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday Experience</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: radial-gradient(circle at top, #0b0f2a, #000);
  overflow: hidden;
  font-family: Arial;
  color: white;
}

/* CENTER */
.container {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

/* TITLE */
h1 {
  font-size: 28px;
  margin-bottom: 10px;
}

/* TEXT */
#typed {
  opacity: 0.7;
  font-size: 15px;
  height: 25px;
  margin-bottom: 40px;
}

/* CAKE (FINAL PREMIUM LOOK) */
.cake {
  width: 340px;
  height: 210px;
  background: linear-gradient(145deg, #2f80ff, #0044aa);
  border-radius: 25px;
  position: relative;
  box-shadow: 0 25px 60px rgba(0,0,0,0.6);
}

/* frosting */
.cake::before {
  content: "";
  position: absolute;
  top: -30px;
  left: 15px;
  right: 15px;
  height: 65px;
  background: #cfe8ff;
  border-radius: 50%;
}

/* candles */
.candle {
  width: 12px;
  height: 70px;
  background: white;
  position: absolute;
  top: -80px;
  border-radius: 6px;
}

.c1 { left: 85px; }
.c2 { left: 160px; }
.c3 { left: 235px; }

/* flame */
.flame {
  width: 14px;
  height: 14px;
  background: orange;
  border-radius: 50%;
  position: absolute;
  top: -18px;
  left: -1px;
  box-shadow: 0 0 20px orange;
}

/* confetti */
.confetti {
  position: absolute;
  width: 8px;
  height: 8px;
  top: 0;
  animation: fall 3s linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(100vh) rotate(360deg);
    opacity: 0;
  }
}

/* particles */
.particle {
  position: absolute;
  width: 4px;
  height: 4px;
  background: rgba(150,200,255,0.8);
  border-radius: 50%;
  animation: float 10s infinite linear;
}

@keyframes float {
  from { transform: translateY(0); }
  to { transform: translateY(-1000px); }
}
</style>
</head>

<body>

<div class="container">

  <h1>🎉 Happy Birthday to Charlie’s Brother 🎉</h1>
  <div id="typed"></div>

  <div class="cake">
    <div class="candle c1"><div class="flame"></div></div>
    <div class="candle c2"><div class="flame"></div></div>
    <div class="candle c3"><div class="flame"></div></div>
  </div>

</div>

<script>

let flames = document.querySelectorAll(".flame");

/* CONFETTI */
function confetti() {
  for (let i = 0; i < 80; i++) {
    let c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * window.innerWidth + "px";
    c.style.background = ["#4da6ff","#ffffff","#99ccff"][i % 3];
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4000);
  }
}

/* MIC */
navigator.mediaDevices.getUserMedia({ audio: true })
.then(stream => {
  const audioCtx = new AudioContext();
  const mic = audioCtx.createMediaStreamSource(stream);
  const analyser = audioCtx.createAnalyser();

  mic.connect(analyser);

  const data = new Uint8Array(analyser.frequencyBinCount);

  function detect() {
    analyser.getByteFrequencyData(data);
    let volume = data.reduce((a,b)=>a+b) / data.length;

    if (volume > 25) {
      flames.forEach(f => f.style.opacity = "0");
      confetti();
    }

    requestAnimationFrame(detect);
  }

  detect();
});

/* TEXT ANIMATION */
let text = "Make a wish ✨";
let i = 0;

function type() {
  if (i < text.length) {
    document.getElementById("typed").innerHTML += text[i];
    i++;
    setTimeout(type, 60);
  }
}
type();

/* PARTICLES */
for (let i = 0; i < 30; i++) {
  let p = document.createElement("div");
  p.className = "particle";
  p.style.left = Math.random() * 100 + "%";
  p.style.animationDuration = (6 + Math.random() * 5) + "s";
  document.body.appendChild(p);
}

</script>

</body>
</html>
