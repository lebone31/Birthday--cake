<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday Premium</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: radial-gradient(circle at top, #0a0a0a, #000);
  overflow: hidden;
  font-family: Arial;
  color: white;
}

/* CENTER LAYER */
.container {
  position: relative;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  z-index: 10; /* IMPORTANT: keeps text above everything */
}

/* TEXT (FIXED FRONT LAYER ISSUE) */
h1 {
  font-size: 28px;
  margin: 0;
  z-index: 20;
  position: relative;
}

#typed {
  margin-top: 10px;
  opacity: 0.8;
  height: 25px;
  z-index: 20;
  position: relative;
}

/* CAKE */
.cake {
  width: 340px;
  height: 210px;
  margin-top: 40px;
  background: linear-gradient(145deg, #000, #222);
  border-radius: 25px;
  position: relative;
  box-shadow: 0 30px 70px rgba(255,255,255,0.08);
  z-index: 5;
}

/* frosting (white contrast) */
.cake::before {
  content: "";
  position: absolute;
  top: -30px;
  left: 15px;
  right: 15px;
  height: 65px;
  background: #fff;
  border-radius: 50%;
  box-shadow: 0 0 25px rgba(255,255,255,0.2);
}

/* candles */
.candle {
  width: 12px;
  height: 70px;
  background: #fff;
  position: absolute;
  top: -80px;
  border-radius: 6px;
}

.c1 { left: 85px; }
.c2 { left: 160px; }
.c3 { left: 235px; }

/* flame */
.flame {
  width: 14px;
  height: 14px;
  background: orange;
  border-radius: 50%;
  position: absolute;
  top: -18px;
  left: -1px;
  box-shadow: 0 0 20px orange;
}

/* BALLOONS */
.balloon {
  position: absolute;
  width: 25px;
  height: 35px;
  border-radius: 50%;
  bottom: -100px;
  animation: float 10s linear infinite;
  z-index: 1;
}

@keyframes float {
  from { transform: translateY(0); }
  to { transform: translateY(-1200px); }
}

/* FLOATING PARTICLES (SUBTLE PREMIUM FEEL) */
.particle {
  position: absolute;
  width: 3px;
  height: 3px;
  background: rgba(255,255,255,0.6);
  border-radius: 50%;
  animation: drift 12s linear infinite;
  z-index: 1;
}

@keyframes drift {
  from { transform: translateY(0); }
  to { transform: translateY(-1000px); }
}
</style>
</head>

<body>

<div class="container">

  <h1>🎉 Happy Birthday to Charlie’s Brother 🎉</h1>
  <div id="typed"></div>

  <div class="cake">
    <div class="candle c1"><div class="flame"></div></div>
    <div class="candle c2"><div class="flame"></div></div>
    <div class="candle c3"><div class="flame"></div></div>
  </div>

</div>

<script>

let flames = document.querySelectorAll(".flame");

/* MIC BLAST */
navigator.mediaDevices.getUserMedia({ audio: true })
.then(stream => {
  const audioCtx = new AudioContext();
  const mic = audioCtx.createMediaStreamSource(stream);
  const analyser = audioCtx.createAnalyser();

  mic.connect(analyser);
  const data = new Uint8Array(analyser.frequencyBinCount);

  function detect() {
    analyser.getByteFrequencyData(data);
    let volume = data.reduce((a,b)=>a+b) / data.length;

    if (volume > 25) {
      flames.forEach(f => f.style.opacity = "0");
    }

    requestAnimationFrame(detect);
  }

  detect();
});

/* TYPE TEXT */
let text = "Make a wish ✨";
let i = 0;

function type() {
  if (i < text.length) {
    document.getElementById("typed").innerHTML += text[i];
    i++;
    setTimeout(type, 60);
  }
}
type();

/* BALLOONS */
for (let i = 0; i < 18; i++) {
  let b = document.createElement("div");
  b.className = "balloon";
  b.style.left = Math.random() * 100 + "%";
  b.style.background = ["#fff","#ccc","#999","#000"][i % 4];
  b.style.animationDuration = (6 + Math.random() * 6) + "s";
  document.body.appendChild(b);
}

/* FLOATING PARTICLES */
for (let i = 0; i < 30; i++) {
  let p = document.createElement("div");
  p.className = "particle";
  p.style.left = Math.random() * 100 + "%";
  p.style.animationDuration = (8 + Math.random() * 5) + "s";
  document.body.appendChild(p);
}

</script>

</body>
</html>
