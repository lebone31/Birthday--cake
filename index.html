<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday Scene</title>

<style>
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  background: radial-gradient(circle at top, #0b1020, #000);
  font-family: Arial;
  color: white;
}

/* FADE IN LIKE TIKTOK INTRO */
body {
  animation: fadeIn 2s ease-in;
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* BACKGROUND FLOATERS */
.balloon {
  position: absolute;
  width: 20px;
  height: 28px;
  border-radius: 50%;
  bottom: -100px;
  animation: floatUp linear infinite;
  opacity: 0.5;
}

@keyframes floatUp {
  from { transform: translateY(0); }
  to { transform: translateY(-120vh); }
}

/* PARTICLES (DEPTH) */
.particle {
  position: absolute;
  width: 3px;
  height: 3px;
  background: rgba(255,255,255,0.4);
  border-radius: 50%;
  animation: drift 10s linear infinite;
}

@keyframes drift {
  from { transform: translateY(0); }
  to { transform: translateY(-1000px); }
}

/* CENTER SCENE */
.scene {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

/* TITLE */
h1 {
  font-size: 26px;
  margin: 0;
  opacity: 0.95;
}

#typed {
  margin-top: 8px;
  font-size: 14px;
  opacity: 0.6;
  height: 20px;
}

/* CAKE */
.cake {
  margin-top: 40px;
  width: 320px;
  height: 200px;
  background: linear-gradient(145deg, #111, #000);
  border-radius: 25px;
  position: relative;
  box-shadow: 0 35px 90px rgba(0,0,0,0.8);
}

/* frosting */
.cake::before {
  content: "";
  position: absolute;
  top: -25px;
  left: 15px;
  right: 15px;
  height: 60px;
  background: white;
  border-radius: 50%;
  box-shadow: 0 0 25px rgba(255,255,255,0.15);
}

/* candles */
.candle {
  width: 10px;
  height: 70px;
  background: white;
  position: absolute;
  top: -75px;
}

.c1 { left: 80px; }
.c2 { left: 150px; }
.c3 { left: 220px; }

/* flame */
.flame {
  width: 12px;
  height: 12px;
  background: orange;
  border-radius: 50%;
  position: absolute;
  top: -15px;
  left: -1px;
  box-shadow: 0 0 20px orange;
  transition: 0.5s ease;
}
</style>
</head>

<body>

<div class="scene">

  <h1>🎉 Happy Birthday to Charlie’s Brother 🎉</h1>
  <div id="typed"></div>

  <div class="cake">
    <div class="candle c1"><div class="flame"></div></div>
    <div class="candle c2"><div class="flame"></div></div>
    <div class="candle c3"><div class="flame"></div></div>
  </div>

</div>

<script>

let flames = document.querySelectorAll(".flame");

/* MIC BLOW (TIKTOK MOMENT) */
navigator.mediaDevices.getUserMedia({ audio: true })
.then(stream => {
  const audioCtx = new AudioContext();
  const mic = audioCtx.createMediaStreamSource(stream);
  const analyser = audioCtx.createAnalyser();

  mic.connect(analyser);
  const data = new Uint8Array(analyser.frequencyBinCount);

  function detect() {
    analyser.getByteFrequencyData(data);
    let volume = data.reduce((a,b)=>a+b) / data.length;

    if (volume > 25) {
      flames.forEach(f => {
        f.style.opacity = "0";
        f.style.transform = "scale(0)";
      });
    }

    requestAnimationFrame(detect);
  }

  detect();
});

/* TYPE INTRO TEXT */
let text = "Make a wish...";
let i = 0;

function type() {
  if (i < text.length) {
    document.getElementById("typed").innerHTML += text[i];
    i++;
    setTimeout(type, 70);
  }
}
type();

/* BALLOONS (SOFT CINEMATIC DRIFT) */
for (let i = 0; i < 18; i++) {
  let b = document.createElement("div");
  b.className = "balloon";
  b.style.left = Math.random() * 100 + "%";
  b.style.background = ["#fff","#ccc","#aaa"][i % 3];
  b.style.animationDuration = (6 + Math.random() * 8) + "s";
  document.body.appendChild(b);
}

/* PARTICLES */
for (let i = 0; i < 30; i++) {
  let p = document.createElement("div");
  p.className = "particle";
  p.style.left = Math.random() * 100 + "%";
  p.style.animationDuration = (5 + Math.random() * 6) + "s";
  document.body.appendChild(p);
}

</script>

</body>
</html>
