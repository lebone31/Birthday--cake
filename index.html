<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday Premium</title>

<style>
body {
  margin: 0;
  font-family: "Arial", sans-serif;
  background: radial-gradient(circle at top, #1a1a2e, #000);
  overflow: hidden;
  color: white;
}

/* CENTER STAGE */
.wrapper {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

/* TITLE */
h1 {
  font-size: 30px;
  letter-spacing: 1px;
}

/* TYPE TEXT */
#typed {
  margin-top: 10px;
  font-size: 16px;
  opacity: 0.7;
  height: 25px;
}

/* PREMIUM CAKE */
.cake {
  width: 340px;
  height: 210px;
  margin-top: 50px;
  background: linear-gradient(145deg, #3aa0ff, #0057d9);
  border-radius: 25px;
  position: relative;
  box-shadow:
    0 0 25px rgba(0,150,255,0.5),
    0 40px 80px rgba(0,0,0,0.7);
}

/* frosting */
.cake::before {
  content: "";
  position: absolute;
  top: -30px;
  left: 15px;
  right: 15px;
  height: 65px;
  background: #bfe3ff;
  border-radius: 50%;
  box-shadow: 0 0 20px rgba(100,180,255,0.5);
}

/* candles */
.candle {
  width: 12px;
  height: 75px;
  background: #fff;
  position: absolute;
  top: -85px;
  border-radius: 6px;
}

/* spacing */
.c1 { left: 85px; }
.c2 { left: 160px; }
.c3 { left: 235px; }

/* flame */
.flame {
  width: 14px;
  height: 14px;
  background: orange;
  border-radius: 50%;
  position: absolute;
  top: -18px;
  left: -1px;
  box-shadow: 0 0 25px orange;
  transition: 0.4s ease;
}

/* CONFETTI */
.confetti {
  position: absolute;
  width: 8px;
  height: 8px;
  top: 0;
  animation: fall 3s linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(100vh) rotate(360deg);
    opacity: 0;
  }
}

/* FLOATING PARTICLES (premium feel) */
.particle {
  position: absolute;
  width: 4px;
  height: 4px;
  background: rgba(120,200,255,0.8);
  border-radius: 50%;
  animation: float 10s infinite linear;
}

@keyframes float {
  from { transform: translateY(0); }
  to { transform: translateY(-1100px); }
}
</style>
</head>

<body>

<div class="wrapper">

  <h1>🎉 Happy Birthday to Charlie’s Brother 🎉</h1>
  <div id="typed"></div>

  <div class="cake">
    <div class="candle c1"><div class="flame"></div></div>
    <div class="candle c2"><div class="flame"></div></div>
    <div class="candle c3"><div class="flame"></div></div>
  </div>

</div>

<script>

let flames = document.querySelectorAll(".flame");

/* ================= CONFETTI ================= */
function confettiBurst() {
  for (let i = 0; i < 90; i++) {
    let c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * window.innerWidth + "px";
    c.style.background = ["#4da6ff","#ffffff","#66ccff","#99ddff"][i % 4];
    c.style.animationDuration = (2 + Math.random() * 2) + "s";

    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4000);
  }
}

/* ================= MIC ================= */
navigator.mediaDevices.getUserMedia({ audio: true })
.then(stream => {
  const audioContext = new AudioContext();
  const mic = audioContext.createMediaStreamSource(stream);
  const analyser = audioContext.createAnalyser();

  mic.connect(analyser);

  const data = new Uint8Array(analyser.frequencyBinCount);

  function detect() {
    analyser.getByteFrequencyData(data);
    let volume = data.reduce((a,b)=>a+b) / data.length;

    if (volume > 25) {
      flames.forEach(f => f.style.opacity = "0");
      confettiBurst();
    }

    requestAnimationFrame(detect);
  }

  detect();
})
.catch(() => {
  console.log("Mic blocked");
});

/* ================= TYPE EFFECT ================= */
let text = "A special day deserves a special moment ✨";
let i = 0;

function type() {
  if (i < text.length) {
    document.getElementById("typed").innerHTML += text.charAt(i);
    i++;
    setTimeout(type, 55);
  }
}
type();

/* ================= PARTICLES ================= */
for (let i = 0; i < 35; i++) {
  let p = document.createElement("div");
  p.className = "particle";
  p.style.left = Math.random() * 100 + "%";
  p.style.animationDuration = (6 + Math.random() * 6) + "s";
  document.body.appendChild(p);
}

</script>

</body>
</html>
